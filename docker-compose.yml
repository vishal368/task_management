services:
  postgres:
    image: postgres:16
    container_name: task-management-db
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/task_management
      JWT_SECRET: local-development-secret
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:


##### http://localhost:5173 application is running on this port.